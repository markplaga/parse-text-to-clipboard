<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark's Awesome Parsing Tool</title>
<meta name="application-name" content="Parsing Tool">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parsing Tool">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e2a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        .error {
            color: red;
        }
/* PWA-UPDATE-SYSTEM v2 */
[hidden]{display:none!important}
.update-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid #1e2a3a;border-radius:5px;padding:12px 14px;font-size:14px;margin:12px 0;max-width:560px}
.update-bar .row{display:flex;gap:8px}
.appfoot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:#555;margin-top:24px;padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px))}
.appfoot button{font:inherit;font-size:13px;cursor:pointer}
    </style>
</head>
<body>
    <h1>Mark's Awesome Parsing Tool</h1>
<!-- PWA-UPDATE-SYSTEM v2 -->
<div class="update-bar" id="updateBar" role="status" aria-live="polite" hidden>
  <span id="updateText">A new version of Parsing Tool is ready. Your text and place in the list live only in this tab — updating reloads the page, so copy out anything you need first.</span>
  <span class="row"><button id="updateNow">Update now</button><button id="updateLater">Later</button></span>
</div>
    <textarea id="textInput" rows="10" cols="50" placeholder="Enter multiple paragraphs here..."></textarea><br>
    <button onclick="pasteFromClipboard()">Paste Clipboard</button>
    <button onclick="parseText()">Copy next entry</button>
    <button onclick="resetForm()">Reset</button>
    <p id="message"></p>
    <p id="currentEntry"></p>
<!-- PWA-UPDATE-SYSTEM v2 -->
<footer class="appfoot">
  <span>Parsing Tool <b>v<span id="appVersion"></span></b></span>
  <span id="updateStatus"></span>
  <button id="checkUpdates" hidden>Check for updates</button>
</footer>

    <script>
        let paragraphs = [];
        let currentIndex = 0;

        function parseText() {
            const textInput = document.getElementById("textInput").value;
            if (paragraphs.length === 0 && textInput.trim() !== "") {
                // Split text by either a new line or a blank line
                paragraphs = textInput.split(/(?:\r?\n)+/).map(para => para.trim()).filter(para => para.length > 0);
            }

            if (currentIndex < paragraphs.length) {
                const nextParagraph = paragraphs[currentIndex];
                currentIndex++;
                copyToClipboard(nextParagraph);
                displayCurrentEntry();
            } else {
                const messageElement = document.getElementById("message");
                messageElement.textContent = "You have reached the end, nothing new has been copied to the clipboard.";
                messageElement.classList.add("error");
                setTimeout(resetForm, 5000);
            }
        }

        function copyToClipboard(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand("copy");
                document.getElementById("message").textContent = `Entry ${currentIndex} of ${paragraphs.length} is in the clipboard: ${text}`;
            } catch (err) {
                document.getElementById("message").textContent = "Failed to copy text: " + err;
            }
            document.body.removeChild(textarea);
        }

        function resetForm() {
            document.getElementById("textInput").value = "";
            document.getElementById("message").textContent = "";
            document.getElementById("message").classList.remove("error");
            document.getElementById("currentEntry").textContent = "";
            paragraphs = [];
            currentIndex = 0;
        }

        function displayCurrentEntry() {
            document.getElementById("currentEntry").textContent = "Current entry: " + currentIndex + " of " + paragraphs.length;
        }

        // PWA-UPDATE-SYSTEM v2 bridge: the update script is a separate
        // <script> and must not guess at this script's state, so expose
        // only what an update needs. isDirty: the pasted text and the
        // parsed paragraphs / current position live only in memory —
        // there is no save function and nothing is persisted, so a
        // reload would lose them and an update must ask first.
        window.__parseTextUpdate = {
            isDirty: function() {
                var input = document.getElementById("textInput");
                var hasText = !!(input && input.value.trim() !== "");
                var inProgress = paragraphs.length > 0 && currentIndex < paragraphs.length;
                return hasText || inProgress;
            }
        };

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                const textInput = document.getElementById("textInput");
                textInput.value += (textInput.value ? "\n" : "") + text; // Appends clipboard content to textarea
                document.getElementById("message").textContent = "Pasted clipboard content successfully.";
            } catch (err) {
                document.getElementById("message").textContent = "Failed to paste from clipboard: " + err;
                document.getElementById("message").classList.add("error");
            }
        }
    </script>
<script>
// PWA-UPDATE-SYSTEM v2: auto-update, version banner, Check for updates. Do not remove this line.
const APP_RELEASE='1.0.0-20261126-1';
const APP_VERSION='1.0.0';
(function(){
  var LATER_KEY = 'parse-text-to-clipboard-update-later-v2';
  var BC_NAME = 'parse-text-to-clipboard-update-v2';

  document.getElementById('appVersion').textContent = APP_VERSION;
  var status = document.getElementById('updateStatus'), checkBtn = document.getElementById('checkUpdates'), bar = document.getElementById('updateBar');
  var say = function(t){ status.textContent = t; };
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  checkBtn.hidden = false;

  var reg = null, userAsked = false, reloading = false, updating = false;
  var remote = null, pendingRelease = null, checkPromise = null;
  // Release the user has acknowledged losing unsaved text for
  // (see applyUpdate). A new release needs a fresh acknowledgement.
  var dirtyAck = null;
  var tabId = 'tab-' + Math.random().toString(36).slice(2) + Date.now().toString(36);

  // The app's own state lives in the v2 bridge
  // (window.__parseTextUpdate, set up in the main script) is the only
  // way this script can ask about it. If the bridge is missing,
  // treat the tab as unsafe to update rather than guessing.
  function bridge(){ return window.__parseTextUpdate || null; }
  function thisTabBlocked(){
    var b = bridge();
    if (!b) return true;
    try { return b.isDirty(); } catch (e) { return true; }
  }

  // Multi-tab coordination over BroadcastChannel.
  var bc = null, bcWaiters = {};
  try { if ('BroadcastChannel' in window) bc = new BroadcastChannel(BC_NAME); } catch (e) {}
  if (bc) bc.onmessage = function(ev){
    var d = ev.data || {};
    if (d.type === 'update-query' && d.from !== tabId) {
      try { bc.postMessage({ type: 'update-response', id: d.id, from: tabId, blocked: thisTabBlocked() }); } catch (e) {}
    } else if (d.type === 'update-response' && bcWaiters[d.id]) {
      bcWaiters[d.id].push(d);
    }
  };
  function queryTabs(release){
    return new Promise(function(resolve){
      if (!bc) return resolve([]);
      var id = 'q-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      var answers = [];
      bcWaiters[id] = answers;
      try { bc.postMessage({ type: 'update-query', id: id, from: tabId, release: release }); } catch (e) {}
      setTimeout(function(){ delete bcWaiters[id]; resolve(answers); }, 800);
    });
  }

  function workerVersion(worker, ms){
    return new Promise(function(resolve){
      if (!worker || !('MessageChannel' in window)) return resolve(null);
      var done = false, timer = null;
      try {
        var ch = new MessageChannel();
        timer = setTimeout(function(){ if (!done) { done = true; resolve(null); } }, ms);
        ch.port1.onmessage = function(ev){
          if (done) return; done = true; clearTimeout(timer);
          var d = ev.data || {};
          resolve((d.release && d.displayVersion) ? d : null);
        };
        worker.postMessage({ type: 'GET_VERSION' }, [ch.port2]);
      } catch (e) { if (timer) clearTimeout(timer); resolve(null); }
    });
  }
  function workerClientCount(worker){
    return new Promise(function(resolve){
      if (!worker || !('MessageChannel' in window)) return resolve(null);
      var done = false, timer = null;
      try {
        var ch = new MessageChannel();
        timer = setTimeout(function(){ if (!done) { done = true; resolve(null); } }, 2000);
        ch.port1.onmessage = function(ev){
          if (done) return; done = true; clearTimeout(timer);
          var d = ev.data || {};
          resolve(typeof d.count === 'number' ? d.count : null);
        };
        worker.postMessage({ type: 'GET_CLIENTS' }, [ch.port2]);
      } catch (e) { if (timer) clearTimeout(timer); resolve(null); }
    });
  }
  function waitControllerChange(ms){
    return new Promise(function(resolve){
      var done = false;
      var timer = setTimeout(function(){ if (!done) { done = true; resolve(false); } }, ms);
      var onChange = function(){
        if (done) return; done = true; clearTimeout(timer);
        navigator.serviceWorker.removeEventListener('controllerchange', onChange);
        resolve(true);
      };
      navigator.serviceWorker.addEventListener('controllerchange', onChange);
    });
  }

  function showBar(display, release, manual){
    if (release) pendingRelease = release;
    var later = null;
    try { later = sessionStorage.getItem(LATER_KEY); } catch (e) {}
    document.getElementById('updateText').textContent = 'Parsing Tool ' + (display ? 'v' + display + ' ' : '') + 'is ready. Your text and place in the list live only in this tab — updating reloads the page, so copy out anything you need first.';
    if (later && release && later === release && !manual) return;
    bar.hidden = false;
    say('An update is ready.');
  }
  function fetchRemote(){
    return fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(info){ remote = (info && typeof info.release === 'string') ? info : null; return remote; })
      .catch(function(){ remote = null; return null; });
  }
  function maybeShowUpdate(manual){
    return fetchRemote().then(function(info){
      if (reg) return reg.update().catch(function(){}).then(function(){ return info; });
      return info;
    }).then(function(info){
      var w = reg && reg.waiting;
      if (!w || !navigator.serviceWorker.controller) {
        if (manual) {
          if (!info) say('Could not reach the server. Try again when you are online.');
          else if (info.release && info.release !== APP_RELEASE) say('Version ' + info.version + ' found. Downloading\u2026');
          else say('You have the latest version (' + APP_VERSION + ').');
        }
        return false;
      }
      return workerVersion(w, 2000).then(function(verified){
        if (verified) {
          if (info && info.release && verified.release !== info.release) {
            if (manual) say('The downloaded update did not match the published release. Try again.');
            return false;
          }
          showBar(verified.displayVersion, verified.release, manual);
          if (manual) say('An update is ready.');
          return true;
        }
        // Handshake failed: show the banner, but name no version.
        showBar(null, info && info.release, manual);
        if (manual) say('An update is ready.');
        return true;
      });
    });
  }
  function check(manual){
    if (checkPromise) return checkPromise;
    if (manual) { say('Checking\u2026'); checkBtn.disabled = true; }
    checkPromise = maybeShowUpdate(manual).catch(function(){ return false; }).then(function(ok){
      checkPromise = null;
      if (manual) checkBtn.disabled = false;
      return ok;
    });
    return checkPromise;
  }
  function track(w){
    if (!w) return;
    w.addEventListener('statechange', function(){
      if (w.state === 'installed') check(false);
    });
  }

  async function applyUpdate(){
    if (updating) return;
    updating = true;
    try {
      var w = reg && reg.waiting;
      if (!w) { say('No update is waiting. Tap Check for updates first.'); return; }
      var expected = pendingRelease || (remote && remote.release);
      var b = bridge();
      if (!b) { say('Could not reach the app to check your text. Try again.'); return; }
      // 1. This tab: the text and progress live only in memory and a
      // reload would lose them. There is no save function and nothing
      // is persisted, so ask first: the first tap warns and records
      // the acknowledgement for this release only; the second tap
      // proceeds. Copying out the remaining entries first is the way
      // to keep the work.
      var dirty = false;
      try { dirty = b.isDirty(); } catch (e) { dirty = true; }
      if (dirty && !(expected && dirtyAck === expected)) {
        dirtyAck = expected;
        say('Your text and progress live only in this tab — a reload would lose them. Copy out anything you need first, then tap Update now again to update anyway.');
        return;
      }
      // 2. Coordinate with other tabs of this app: a tab with
      // unsaved text blocks the update — its user is not looking at
      // this tab to consent.
      say('Checking other tabs\u2026');
      var answers = await queryTabs(expected);
      if (answers.some(function(a){ return a.blocked; })) {
        say('Another Parsing Tool tab has unsaved text — finish or clear it there first, or close that tab.');
        return;
      }
      if (answers.length === 0) {
        var count = await workerClientCount(w);
        if (count === null || count > 1) {
          say('Another Parsing Tool tab is open and couldn\u2019t confirm it\u2019s safe.');
          return;
        }
      }
      // 3. Activate only the specific waiting worker.
      say('Updating\u2026');
      userAsked = true;
      var changed = waitControllerChange(8000);
      w.postMessage({ type: 'SKIP_WAITING' });
      var ok = await changed;
      if (!ok) {
        userAsked = false;
        say('The update did not start. Tap Update now to try again, or Later to defer it.');
        return;
      }
      // 4. Verify the new controller really is the expected release,
      // then reload exactly once. No blind reload fallback exists.
      var info = await workerVersion(navigator.serviceWorker.controller, 2000);
      if (!info || (expected && info.release !== expected)) {
        userAsked = false;
        say('The update did not take over as expected. Tap Update now to try again, or Later to defer it.');
        return;
      }
      if (reloading) return;
      reloading = true;
      location.reload();
    } finally { updating = false; }
  }

  document.getElementById('updateNow').onclick = applyUpdate;
  document.getElementById('updateLater').onclick = function(){
    bar.hidden = true;
    dirtyAck = null;
    try { sessionStorage.setItem(LATER_KEY, pendingRelease || (remote && remote.release) || '?'); } catch (e) {}
    say('Update postponed. You will be asked again next time you open the app, or tap Check for updates.');
  };
  checkBtn.onclick = function(){ check(true); };
  // A controllerchange on its own (first install, or an update
  // activated from another tab) never reloads this page: only an
  // explicit Update now in this tab does, after verification in
  // applyUpdate. There is deliberately no reload here.
  window.addEventListener('load', async function(){
    try { reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none', scope: './' }); } catch (e) { return; }
    if (reg.waiting) check(false);
    track(reg.installing);
    reg.addEventListener('updatefound', function(){ track(reg.installing); });
    check(false);
  });
  var last = Date.now();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && Date.now() - last > 5 * 60e3) { last = Date.now(); check(false); }
  });
  setInterval(function(){
    if (document.visibilityState === 'visible') { last = Date.now(); check(false); }
  }, 60 * 60e3);
})();
</script>
</body>
